packages:
  - "apps/*"
  - "packages/*"

# THE credkit pin (MIGRATION.md §11): @credkit/* is consumed as Git
# dependencies from the public repo, pinned to one commit sha. package.json
# deps name the plain version ("0.1.0"); these overrides rewrite every
# @credkit/* spec — including the workspace:* specs credkit's own packages
# use internally, which pnpm leaves unconverted in git-dep tarballs — to the
# pinned git spec before resolution. Bump the sha here and nowhere else.
overrides:
  "@credkit/bbs": "github:tmarkovski/credkit#a7c4f6503f220fed0caf6417b4b3cd51bbd54e1b&path:/packages/bbs"
  "@credkit/accumulator": "github:tmarkovski/credkit#a7c4f6503f220fed0caf6417b4b3cd51bbd54e1b&path:/packages/accumulator"
  "@credkit/range": "github:tmarkovski/credkit#a7c4f6503f220fed0caf6417b4b3cd51bbd54e1b&path:/packages/range"
  "@credkit/proofs": "github:tmarkovski/credkit#a7c4f6503f220fed0caf6417b4b3cd51bbd54e1b&path:/packages/proofs"
  "@credkit/cryptosuite": "github:tmarkovski/credkit#a7c4f6503f220fed0caf6417b4b3cd51bbd54e1b&path:/packages/cryptosuite"
