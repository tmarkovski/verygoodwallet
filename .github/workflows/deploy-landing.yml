# Deploys the landing site (apps/landing) to Cloudflare Workers (static assets).
#
# Deploys on every push to main so the live Worker never lags the repo;
# workflow_dispatch stays for redeploying without a commit. The landing links
# to the other sites through build-time defaults in src/origins.ts (live
# Worker origins today; the custom domains after the M6 cutover), so no
# origin inputs are needed here.
name: Deploy Landing

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from the "packageManager" field in the root package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing
        run: pnpm --filter @vgw/landing build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/landing
          # Must be explicit: the action's package-manager detection only looks
          # for a lockfile inside workingDirectory, finds none (pnpm-lock.yaml
          # lives at the repo root), and falls back to npm — which cannot
          # resolve the workspace:* deps in apps/landing/package.json.
          packageManager: pnpm
          # Pin wrangler; the action's built-in default (3.90.0, Nov 2024) is
          # stale and predates the compatibility_date in wrangler.jsonc.
          wranglerVersion: "4.110.0"
