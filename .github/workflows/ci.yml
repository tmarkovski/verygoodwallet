name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        # pnpm version is taken from the "packageManager" field in the root
        # package.json (pnpm@10.x). Do not pin a version here as well —
        # pnpm/action-setup fails when both are specified and disagree.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke-test DMV Worker bundle under workerd
        # vitest runs the Worker in plain Node and `vite build` never starts
        # the runtime, so only this catches bundles that fail Cloudflare's
        # script-startup validation (see apps/dmv/scripts/smoke.mjs).
        run: pnpm --filter @vgw/dmv smoke
