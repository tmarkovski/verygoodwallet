# Deploys the Utopia DMV issuer (apps/dmv) to Cloudflare Workers.
#
# One deployable: the Hono Worker (OID4VCI endpoints) plus the static DMV UI,
# built by @cloudflare/vite-plugin. `vite build` writes a snapshot config to
# dist/vgw_dmv/wrangler.json (plus a .wrangler/deploy redirect), which
# `wrangler deploy` picks up automatically when run from apps/dmv.
#
# Manual trigger only for now: the CLOUDFLARE_* secrets must be configured
# first, and the Worker secrets ISSUER_SEED / TOKEN_SECRET should be set
# after the first deploy (see DEPLOY.md) — without them the Worker falls back
# to public dev constants.
#
# wallet_origin must NEVER default to the apex domain: until the M6 cutover
# it serves the legacy GitHub Pages app, which cannot handle credential
# offers — that would bake dead-end, PII-leaking links and QR codes into
# every offer this deploy issues. The prefilled default below is the KNOWN
# deployed wallet Worker URL (verified live 2026-07-13); flip it to
# https://verygoodwallet.com at the M6 apex cutover.
name: Deploy DMV

on:
  workflow_dispatch:
    inputs:
      wallet_origin:
        description: >-
          Wallet origin that issued offer links/QR codes target (see
          DEPLOY.md; switches to the apex domain at the M6 cutover).
        required: true
        type: string
        default: https://vgw-wallet.t7m8.workers.dev

concurrency:
  group: deploy-dmv
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from the "packageManager" field in the root package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate wallet_origin
        # Fail fast on anything that isn't a bare http(s) origin. Besides
        # catching typos before they surface as a broken deployed UI, this
        # keeps the value safe to interpolate into the wrangler command below
        # (a bare origin has no path — no shell metacharacters possible).
        run: |
          node -e '
            const value = process.env.WALLET_ORIGIN_INPUT;
            let url;
            try { url = new URL(value); } catch {
              console.error(`wallet_origin is not a URL: ${value}`);
              process.exit(1);
            }
            if (url.protocol !== "https:" && url.protocol !== "http:") {
              console.error(`wallet_origin must be http(s): ${value}`);
              process.exit(1);
            }
            if (url.origin !== value) {
              console.error(
                `wallet_origin must be a bare origin (no trailing slash or path); use: ${url.origin}`,
              );
              process.exit(1);
            }
          '
        env:
          WALLET_ORIGIN_INPUT: ${{ inputs.wallet_origin }}

      - name: Build DMV
        run: pnpm --filter @vgw/dmv build
        env:
          # Bakes the wallet origin into the client bundle: the UI builds the
          # visible link and QR code client-side, so the Worker var alone is
          # not enough (it only covers the server's wallet_link fallback).
          VITE_WALLET_ORIGIN: ${{ inputs.wallet_origin }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/dmv
          # Must be explicit: the action's package-manager detection only looks
          # for a lockfile inside workingDirectory, finds none (pnpm-lock.yaml
          # lives at the repo root), and falls back to npm — which cannot
          # resolve the workspace:* deps in apps/dmv/package.json.
          packageManager: pnpm
          # Pin wrangler; the action's built-in default (3.90.0, Nov 2024) is
          # stale and predates the compatibility_date in wrangler.jsonc.
          wranglerVersion: "4.110.0"
          # WALLET_ORIGIN covers the server-built wallet_link for API-only
          # consumers; the client bundle got the same origin at build time.
          command: deploy --var WALLET_ORIGIN:${{ inputs.wallet_origin }}
